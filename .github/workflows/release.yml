name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "DATES v__VERSION__"
          releaseBody: |
            ## DATES v__VERSION__

            Компактный напоминатель дней рождения и знаменательных дат для Windows.

            ### Что нового
            - Сезонные скины и тёмная тема
            - Календарь с отдельными метками ДР / праздник / именины / своё
            - Расширенный каталог российских праздников
            - Улучшенная панель событий и пустые состояния
            - Автопроверка обновлений и стабильнее уведомления/трей

            ### Установка
            - `DATES_*_x64-setup.exe` — установщик NSIS (рекомендуется)
            - `DATES_*_x64_en-US.msi` — MSI

            После установки приложение само проверяет обновления на GitHub Releases.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
